openapi: 3.1.0
x-stoplight:
  id: 1ho22pl6hug83
info:
  title: Money Forward Invoice API
  version: 3.6.0
  summary: Money Forward Invoice API
  description: |-
    ### マネーフォワード クラウド請求書APIについて
    https://biz.moneyforward.com/support/invoice/guide/api-guide/a03.html
    ### マネーフォワード クラウド請求書API v3 スタートアップガイド
    https://biz.moneyforward.com/support/invoice/guide/api-guide/a04.html
servers:
  - url: /api/v3
paths:
  /office:
    parameters: []
    get:
      summary: Get my office
      description: 事業者情報の取得
      tags:
        - Office
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Office'
              examples:
                if-corporation-office:
                  $ref: '#/components/examples/CorporationOffice'
                if-individual-office:
                  $ref: '#/components/examples/IndividualOffice'
        '404':
          description: Not Found
      operationId: get-office
      x-mcp:
        operationKind: read
        description: 'ログイン中の事業者（自社）の情報を取得する。法人・個人事業主いずれかの形態に応じた情報を返す。'
        useWhen: '自社の事業者情報（名称・住所・適格請求書発行事業者番号など）を確認する場合。'
    put:
      summary: Update my office
      description: 事業者情報の更新
      operationId: put-office
      x-mcp:
        operationKind: update
        description: 'ログイン中の事業者（自社）の情報を更新する。'
        useWhen: '自社の事業者情報を変更・更新する場合。'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Office'
              examples:
                if-corporation-office:
                  $ref: '#/components/examples/CorporationOffice'
                if-individual-office:
                  $ref: '#/components/examples/IndividualOffice'
        '400':
          description: Bad Request
      requestBody:
        $ref: '#/components/requestBodies/OfficeUpdateRequest'
      tags:
        - Office
      security:
        - AccessToken:
            - mfc/invoice/data.write
  /office/registration_code:
    put:
      summary: Update registration code of my office
      description: 適格請求書発行事業者番号の作成・更新
      operationId: put-office-registration-code
      x-mcp:
        operationKind: update
        description: '自社の適格請求書発行事業者番号（インボイス登録番号、T+13桁）を作成・更新する。'
        useWhen: 'インボイス制度の適格請求書発行事業者番号を新規登録または変更する場合。'
        doNotUseWhen: '登録番号を削除する場合はdelete-office-registration_codeを使用。'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  registration_code:
                    type: string
                required:
                  - registration_code
              examples:
                Example:
                  value:
                    registration_code: T1234567890123
        '400':
          description: Bad Request
      tags:
        - Office
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                registration_code:
                  type: string
                  pattern: '/^T\d{13}$/'
              required:
                - registration_code
            examples: {}
      security:
        - AccessToken:
            - mfc/invoice/data.write
    delete:
      summary: Delete registration code of my office
      description: 適格請求書発行事業者番号の削除
      operationId: delete-office-registration_code
      x-mcp:
        operationKind: delete
        description: '自社の適格請求書発行事業者番号（インボイス登録番号）を削除する。'
        useWhen: '登録済みの適格請求書発行事業者番号を削除する場合。この操作は元に戻せない。'
        doNotUseWhen: '登録番号を新規作成・更新する場合はput-office-registration-codeを使用。'
      responses:
        '204':
          description: OK
      tags:
        - Office
      security:
        - AccessToken:
            - mfc/invoice/data.write
  /partners:
    get:
      summary: Get partners
      description: 取引先一覧の取得
      tags:
        - Partner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Partner'
                  pagination:
                    $ref: '#/components/schemas/PaginationData'
                required:
                  - data
                  - pagination
              examples:
                Example:
                  value:
                    data:
                      - id: 95PHKI9_FeSw3coTj673Cg
                        code: p41uz1dyvw3cj71qrkja
                        name: Ryu p41uz1dyvw3cj71qrkja
                        name_kana: p41uz1dyvw3cj71qrkja
                        name_suffix: 御中
                        memo: p41uz1dyvw3cj71qrkja
                        created_at: '2023-03-20 13:39:28 +0900'
                        updated_at: '2023-03-20 13:39:28 +0900'
                        departments:
                          - id: qwc4iT7ZrywxipJCOqtZQg
                            zip: 123-4567
                            tel: '1234567'
                            prefecture: 山形県
                            address1: hb3m8kaxz9eex1czmpn2
                            address2: hb3m8kaxz9eex1czmpn2
                            person_name: hb3m8kaxz9eex1czmpn2
                            person_title: hb3m8kaxz9eex1czmpn2
                            person_dept: hb3m8kaxz9eex1czmpn2
                            email: hb3m8kaxz9eex1czmpn2@moneyforward.com
                            cc_emails: hb3m8kaxz9eex1czmpn2@moneyforward.com
                            peppol_id: 0088:0000000000001
                            office_member_name: hb3m8kaxz9eex1czmpn2
                            office_member_id: '-UNhHGbLKnWH5xlrFhj2ow'
                            created_at: '2023-03-20 13:44:52 +0900'
                            updated_at: '2023-03-20 13:44:52 +0900'
                    pagination:
                      total_count: 3
                      total_pages: 3
                      per_page: 1
                      current_page: 3
      operationId: get-partners
      x-mcp:
        operationKind: read
        description: '取引先の一覧を取得する。取引先名・顧客コード・カナ・担当者名などで絞り込み可能。ページネーション対応。'
        useWhen: '複数の取引先を一覧・検索する場合。取引先名や顧客コードで取引先を探す場合。'
        doNotUseWhen: '取引先IDが既知で1件だけ取得する場合はget-partners-idを使用。'
      parameters:
        - schema:
            type: string
          in: query
          name: name
          description: 'Partner name, it can be specified multiple value by separating them with a comma.'
          x-mcp:
            description: '取引先名で絞り込む。部分一致検索。カンマ区切りで複数指定可能。'
        - schema:
            type: string
          in: query
          name: code
          description: 'Partner code, it can be specified multiple value by separating them with a comma.'
          x-mcp:
            description: '顧客コードで絞り込む。カンマ区切りで複数指定可能。'
        - schema:
            type: string
          in: query
          name: name_kana
          description: 'Name of partner with katakana, it can be specified multiple value by separating them with a comma.'
          x-mcp:
            description: '取引先名（カナ）で絞り込む。カンマ区切りで複数指定可能。'
        - schema:
            type: string
          in: query
          name: partner_pic
          description: 'Name of a person in charge of the partner, it can be specified multiple value by separating them with a comma.'
          x-mcp:
            description: '取引先側の担当者名で絞り込む。カンマ区切りで複数指定可能。'
        - schema:
            type: string
          in: query
          name: office_pic
          description: "Office member's name in charge of the department, it can be specified multiple value by separating them with a comma."
          x-mcp:
            description: '自社側の部署担当者名で絞り込む。カンマ区切りで複数指定可能。'
        - schema:
            type: integer
            minimum: 1
          in: query
          name: page
          description: 'default: 1'
          x-mcp:
            description: '取得するページ番号。1以上の整数。default: 1。'
        - schema:
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: per_page
          description: 'default: 100'
          x-mcp:
            description: '1ページあたりの取得件数。1〜100の整数。default: 100。'
    post:
      summary: Create new partner
      description: 取引先の作成
      operationId: post-partners
      x-mcp:
        operationKind: create
        description: '取引先を新規作成する。部署情報を含めて登録可能。'
        useWhen: '新しい取引先を登録する場合。'
        doNotUseWhen: '既存の取引先情報を更新する場合はput-partners-idを使用。'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
              examples:
                Example:
                  $ref: '#/components/examples/PartnerWithDepartment'
        '400':
          description: Bad Request
      requestBody:
        $ref: '#/components/requestBodies/PartnerCreateRequest'
      tags:
        - Partner
      security:
        - AccessToken:
            - mfc/invoice/data.write
  '/partners/{partner_id}':
    parameters:
      - schema:
          type: string
        name: partner_id
        in: path
        required: true
        x-mcp:
          description: '取引先ID。get-partnersで取得可能。必須。存在しないIDの場合はエラー。'
    get:
      summary: Get a partner
      description: 取引先の取得
      tags:
        - Partner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
              examples:
                with-departments:
                  $ref: '#/components/examples/PartnerWithDepartment'
                without-departments:
                  $ref: '#/components/examples/PartnerWithoutDepartment'
        '404':
          description: Not Found
      operationId: get-partners-id
      x-mcp:
        operationKind: read
        description: '指定したIDの取引先を1件取得する。部署情報を含む。'
        useWhen: '取引先IDが既知で、その1件の詳細を取得する場合。'
        doNotUseWhen: '複数件の一覧・検索が必要な場合はget-partnersを使用。'
    put:
      summary: Update a partner
      description: 取引先の更新
      operationId: put-partners-id
      x-mcp:
        operationKind: update
        description: '指定したIDの取引先情報を更新する。'
        useWhen: '既存の取引先の情報を変更する場合。'
        doNotUseWhen: '新しい取引先を作成する場合はpost-partnersを使用。'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
              examples:
                Example:
                  $ref: '#/components/examples/PartnerWithDepartment'
        '400':
          description: Bad Request
      requestBody:
        $ref: '#/components/requestBodies/PartnerUpdateRequest'
      tags:
        - Partner
      security:
        - AccessToken:
            - mfc/invoice/data.write
    delete:
      summary: Delete a partner
      description: 取引先の削除
      operationId: delete-partners-id
      x-mcp:
        operationKind: delete
        description: '指定したIDの取引先を削除する。'
        useWhen: '取引先を削除する場合。この操作は元に戻せない。'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
      tags:
        - Partner
      security:
        - AccessToken:
            - mfc/invoice/data.write
  '/partners/{partner_id}/departments':
