    PartnerCreateRequest:
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                maxLength: 30
              name:
                type: string
                maxLength: 100
              name_kana:
                type: string
                maxLength: 350
              name_suffix:
                type: string
              memo:
                type: string
                maxLength: 500
              departments:
                description: 'Array of objects, maximum 10 items. Fill in at least one parameter'
                type: array
                items:
                  type: object
                  properties:
                    zip:
                      type: string
                      minLength: 7
                      maxLength: 8
                      pattern: '^\d{3}-?\d{4}$'
                    tel:
                      type: string
                      pattern: '/\A(\+|＋)?[0-9０-９\-|－|ー|−]+\s*+\z/'
                      minLength: 7
                      maxLength: 30
                    prefecture:
                      type: string
                    address1:
                      type: string
                      maxLength: 80
                    address2:
                      type: string
                      maxLength: 80
                    person_name:
                      type: string
                      maxLength: 35
                    person_title:
                      type: string
                      maxLength: 35
                    person_dept:
                      type: string
                      maxLength: 35
                    office_member_name:
                      type: string
                      maxLength: 40
                    email:
                      type: string
                      maxLength: 255
                    cc_emails:
                      type: string
                      maxLength: 500
                    peppol_id:
                      type: string
                      pattern: '/\A((0088|0188):[0-9]{13}|0221:T[0-9]{13})\z/'
              payment_deadline_setting:
                type: object
                properties:
                  due_month:
                    type: string
                    description: |
                      支払期日（月）:
                        * `this_month` - 当月
                        * `next_month` - 翌月
                        * `two_months_after` - 2ヶ月後
                        * `three_months_after` - 3ヶ月後
                        * `four_months_after` - 4ヶ月後
                        * `five_months_after` - 5ヶ月後
                        * `six_months_after` - 6ヶ月後
                    enum:
                      - this_month
                      - next_month
                      - two_months_after
                      - three_months_after
                      - four_months_after
                      - five_months_after
                      - six_months_after
                  due_date:
                    type: integer
                    description: |
                      Enter the payment due date.
                      If you want to set it to the last day of the month, set it to "-1".
                      If you want to set it to a specific day, set it to a number between 1 and 31.
                      Note: 0 is not a valid value.
                      If no corresponding day exists, the last day of the month will be automatically set.
                    minimum: -1
                    maximum: 31
                  contingency_day:
                    type: string
                    description: |
                      支払期日が休日の場合の処理:
                        * `move_to_earlier_day` - 前倒し
                        * `keep_as_is` - そのまま
                        * `move_to_later_day` - 後倒し
                    enum:
                      - move_to_earlier_day
                      - keep_as_is
                      - move_to_later_day
                required:
                  - due_month
                  - due_date
                  - contingency_day
            required:
              - name
