      operationId: get-partners-partner_id-departments-id
      x-mcp:
        operationKind: read
        description: '指定した取引先の指定IDの部署を1件取得する。'
        useWhen: '取引先IDと部署IDが既知で、その部署の詳細を取得する場合。'
        doNotUseWhen: '部署を一覧・検索する場合はget-partners-id-partner-departmentsを使用。'
    put:
      summary: Update a department
      description: 取引先部署の更新
      operationId: put-partners-partner_id-departments-id
      x-mcp:
        operationKind: update
        description: '指定した取引先の指定IDの部署情報を更新する。'
        useWhen: '既存の部署情報を変更する場合。'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
              examples:
                Example:
                  $ref: '#/components/examples/Department'
        '400':
          description: Bad Request
        '404':
          description: Partner is not found
      requestBody:
        $ref: '#/components/requestBodies/DepartmentUpdateRequest'
      tags:
        - Department
      security:
        - AccessToken:
            - mfc/invoice/data.write
    delete:
