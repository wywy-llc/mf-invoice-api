                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'
                  pagination:
                    $ref: '#/components/schemas/PaginationData'
                required:
                  - data
                  - pagination
              examples:
                Example:
                  value:
                    data:
                      - id: qwc4iT7ZrywxipJCOqtZQg
                        zip: 123-4567
                        tel: '1234567'
                        prefecture: 山形県
                        address1: hb3m8kaxz9eex1czmpn2
                        address2: hb3m8kaxz9eex1czmpn2
                        person_name: hb3m8kaxz9eex1czmpn2
                        person_title: hb3m8kaxz9eex1czmpn2
                        person_dept: hb3m8kaxz9eex1czmpn2
                        email: hb3m8kaxz9eex1czmpn2@moneyforward.com
                        cc_emails: hb3m8kaxz9eex1czmpn2@moneyforward.com
                        peppol_id: 0088:0000000000001
                        office_member_name: hb3m8kaxz9eex1czmpn2
                        office_member_id: '-UNhHGbLKnWH5xlrFhj2ow'
                        created_at: '2023-03-20 13:44:52 +0900'
                        updated_at: '2023-03-20 13:44:52 +0900'
                    pagination:
                      total_count: 1
                      total_pages: 1
                      per_page: 1
                      current_page: 1
        '404':
          description: 'A partner is not found '
      operationId: get-partners-id-partner-departments
      x-mcp:
        operationKind: read
        description: '指定した取引先に紐づく部署の一覧を取得する。ページネーション対応。'
        useWhen: 'ある取引先に登録された複数の部署を一覧・検索する場合。'
        doNotUseWhen: '部署IDが既知で1件取得する場合はget-partners-partner_id-departments-idを使用。'
    post:
      summary: Create new department
      description: 取引先部署の作成
      operationId: post-partners-id-departments
      x-mcp:
        operationKind: create
        description: '指定した取引先に新しい部署を作成する。'
        useWhen: '取引先に新しい部署を追加する場合。'
        doNotUseWhen: '既存の部署を更新する場合はput-partners-partner_id-departments-idを使用。'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
              examples:
                Example:
                  $ref: '#/components/examples/Department'
        '400':
          description: Bad Request
        '404':
          description: Partner is not found
      requestBody:
        $ref: '#/components/requestBodies/DepartmentCreateRequest'
      tags:
        - Department
      security:
        - AccessToken:
            - mfc/invoice/data.write
  '/partners/{partner_id}/departments/{department_id}':
    parameters:
      - schema:
          type: string
        name: partner_id
        in: path
        required: true
        x-mcp:
          description: '取引先ID。get-partnersで取得可能。必須。存在しないIDの場合はエラー。'
      - schema:
          type: string
        name: department_id
        in: path
        required: true
        x-mcp:
          description: '取引先部署ID。get-partners-id-partner-departmentsで取得可能。必須。存在しないIDの場合はエラー。'
    get:
