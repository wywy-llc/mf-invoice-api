        '400':
          description: Bad Request
      requestBody:
        $ref: '#/components/requestBodies/ItemCreateRequest'
      tags:
        - Item
      security:
        - AccessToken:
            - mfc/invoice/data.write
  '/items/{item_id}':
    parameters:
      - schema:
